<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View quiz results, leaderboard, and participant data"
    />
    <meta name="theme-color" content="#5b6cff" />
    <title>Quiz Results</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="css/results.css" />
  </head>

  <body>
    <!-- ===== TOP BAR ===== -->
    <div class="top-bar" role="banner">
      <i
        class="fa fa-arrow-left back-btn"
        onclick="goBack()"
        role="button"
        tabindex="0"
        aria-label="Go back to quiz dashboard"
        title="Back"
      ></i>
      <h2 id="pageTitle">Quiz Results</h2>
    </div>

    <div class="container">
      <!-- Quiz Info Card -->
      <div class="info-card">
        <h3 id="quizTitle">Loading...</h3>
        <p id="quizDesc"></p>
      </div>

      <!-- Results Card -->
      <div class="results-card">
        <!-- Tabs -->
        <div class="tabs">
          <button
            class="tab-btn active"
            onclick="switchTab('participants', this)"
            aria-label="View participants"
          >
            <i class="fa fa-users"></i> Participants
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('leaderboard', this)"
            aria-label="View leaderboard"
          >
            <i class="fa fa-trophy"></i> Leaderboard
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('summary', this)"
            aria-label="View summary statistics"
          >
            <i class="fa fa-chart-bar"></i> Summary
          </button>
        </div>

        <!-- Tab Content -->
        <div
          id="participants"
          class="tab-content active"
          role="region"
          aria-live="polite"
        >
          <!-- Search Bar -->
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search by name or roll number..."
              aria-label="Search participants"
            />
            <i class="fa fa-search search-icon"></i>
          </div>

          <!-- Participants Table -->
          <div id="participantsTable" class="table-container"></div>
        </div>

        <div
          id="leaderboard"
          class="tab-content"
          role="region"
          aria-live="polite"
        ></div>

        <div
          id="summary"
          class="tab-content"
          role="region"
          aria-live="polite"
        ></div>
      </div>
    </div>

    <!-- Footer -->
    <div style="text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; padding-bottom: 20px;">
      <i class="fa fa-code"></i> Developed by <strong>Maviya Attar</strong>
    </div>

    <!-- External JavaScript -->
    <script src="js/results.js"></script>
  </body>
</html>
