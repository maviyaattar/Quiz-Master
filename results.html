<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View detailed quiz results, leaderboard, and participant submissions"
    />
    <meta name="theme-color" content="#5b6cff" />
    <title>Quiz Results</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-QDA5QrzIAqmF+ZKSf96z8QFhOkM/n4ZZrGy0mPkIgfcegIjWKc5ouNQsfyBDVToTxliqcuqRPYsHiKaPDrga=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="css/results.css" />
  </head>

  <body>
    <!-- ===== TOP BAR ===== -->
    <div class="top-bar" role="banner">
      <i
        class="fa fa-arrow-left back-btn"
        onclick="goBack()"
        role="button"
        tabindex="0"
        aria-label="Go back to quiz details"
        title="Back"
      ></i>
      <h3>Quiz Results</h3>
    </div>

    <div class="container">
      <!-- ===== HEADER SECTION ===== -->
      <div class="results-header">
        <div class="quiz-info">
          <h1 id="quizTitle">Loading...</h1>
          <p id="quizDesc" class="quiz-description"></p>
          <div class="quiz-meta">
            <span class="meta-item">
              <i class="fa fa-code"></i>
              <strong>Code:</strong> <span id="quizCode">-</span>
            </span>
            <span class="meta-item">
              <i class="fa fa-clock"></i>
              <strong>Status:</strong> <span id="quizStatus" class="status-badge">-</span>
            </span>
          </div>
        </div>
      </div>

      <!-- ===== SEARCH BAR ===== -->
      <div class="search-section">
        <div class="search-box">
          <i class="fa fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by name, roll number, or branch..."
            aria-label="Search participants"
          />
          <button
            class="clear-search-btn"
            id="clearSearchBtn"
            onclick="clearSearch()"
            aria-label="Clear search"
            style="display: none;"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>

      <!-- ===== TABS ===== -->
      <div class="tabs">
        <button
          class="tab-btn active"
          onclick="switchTab('participants', this)"
          aria-label="View participants"
        >
          <i class="fa fa-users"></i> Participants
        </button>
        <button
          class="tab-btn"
          onclick="switchTab('leaderboard', this)"
          aria-label="View leaderboard"
        >
          <i class="fa fa-chart-bar"></i> Leaderboard
        </button>
        <button
          class="tab-btn"
          onclick="switchTab('summary', this)"
          aria-label="View summary statistics"
        >
          <i class="fa fa-info-circle"></i> Summary
        </button>
      </div>

      <!-- ===== TAB CONTENT ===== -->
      <div class="results-content">
        <!-- Participants Tab -->
        <div
          id="participants"
          class="tab-content active"
          role="region"
          aria-live="polite"
        >
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
        </div>

        <!-- Leaderboard Tab -->
        <div
          id="leaderboard"
          class="tab-content"
          role="region"
          aria-live="polite"
        >
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
        </div>

        <!-- Summary Tab -->
        <div
          id="summary"
          class="tab-content"
          role="region"
          aria-live="polite"
        >
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; padding-bottom: 20px;">
      <i class="fa fa-code"></i> Developed by <strong>Maviya Attar</strong>
    </div>

    <!-- External JavaScript -->
    <script src="js/results.js"></script>
  </body>
</html>
