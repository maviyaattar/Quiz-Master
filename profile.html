<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View and manage your profile"
    />
    <meta name="theme-color" content="#5b6cff" />
    <title>Profile</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-QDA5QrzIAqmF+ZKSf96z8QFhOkM/n4ZZrGy0mPkIgfcegIjWKc5ouNQsfyBDVToTxliqcuqRPYsHiKaPDrga=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="css/profile.css" />
  </head>

  <body>
    <!-- ===== TOP NAVIGATION (Desktop) ===== -->
    <nav class="top-nav">
      <div class="brand">User Profile</div>
      <div class="nav-links">
        <a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
        <a href="create.html"><i class="fa fa-plus-circle"></i> Create Test</a>
        <a href="profile.html" class="active"><i class="fa fa-user"></i> Profile</a>
      </div>
    </nav>

    <div class="container">
      <div class="profile-card">
        <!-- Avatar -->
        <div class="avatar-wrapper">
          <div class="avatar skeleton skeleton-avatar" id="avatar" aria-label="User avatar">
            ?
          </div>
          <div class="avatar-badge">
            <i class="fas fa-check-circle"></i>
          </div>
        </div>

        <!-- User Name -->
        <div class="name skeleton skeleton-text" id="name">Loading...</div>

        <!-- User Email -->
        <div class="email skeleton skeleton-text" id="email"></div>

        <!-- Stats Section -->
        <div class="stats-grid" id="statsGrid">
          <div class="stat-box">
            <div class="stat-icon">
              <i class="fas fa-clipboard-list"></i>
            </div>
            <div class="stat-value" id="totalQuizzes">0</div>
            <div class="stat-label">Total Quizzes</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon">
              <i class="fas fa-users"></i>
            </div>
            <div class="stat-value" id="totalParticipants">0</div>
            <div class="stat-label">Participants</div>
          </div>
        </div>

        <!-- Info Section -->
        <div class="info-section">
          <div class="info">
            <i class="fas fa-user-shield"></i>
            <div>
              <strong>Role</strong>
              <span>Quiz Creator</span>
            </div>
          </div>

          <div class="info">
            <i class="fas fa-calendar-check"></i>
            <div>
              <strong>Member Since</strong>
              <span id="memberSince">Loading...</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="action-buttons">
          <button
            class="btn btn-dashboard"
            onclick="goToDashboard()"
            aria-label="Go to dashboard"
          >
            <i class="fas fa-th-large"></i> Dashboard
          </button>
          <button
            class="btn btn-logout"
            onclick="logout()"
            aria-label="Logout from your account"
          >
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </div>

    <!-- ===== BOTTOM NAVIGATION ===== -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <a href="dashboard.html" role="button" aria-label="Go to home">
        <i class="fa fa-home"></i>
        <span>Home</span>
      </a>
      <a href="create.html" role="button" aria-label="Create new quiz">
        <i class="fa fa-plus-circle"></i>
        <span>Create</span>
      </a>
      <a href="profile.html" class="active" role="button" aria-label="View profile" aria-current="page">
        <i class="fa fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>

    <!-- Footer -->
    <div style="text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; padding-bottom: 20px;">
      <i class="fa fa-code"></i> Developed by <strong>Maviya Attar</strong>
    </div>

    <!-- External JavaScript -->
    <script src="js/profile.js"></script>
  </body>
</html>
