<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or Register - Professional online quiz platform">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#5b6cff">
  
  <title>Authentication</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-box card">
    <div class="auth-header">
      <h2>Welcome to Quiz Master</h2>
      <p>Sign in to create amazing quizzes or join exciting tests</p>
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="switchAuth('login')">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <button id="registerTab" onclick="switchAuth('register')">
        <i class="fas fa-user-plus"></i> Register
      </button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" onsubmit="login(event)">
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input id="email" class="input" placeholder="Email" type="email" required>
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input id="password" type="password" class="input" placeholder="Password" required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit">
        <i class="fas fa-arrow-right"></i> Login
      </button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" style="display:none" onsubmit="registerUser(event)">
      <div class="input-group">
        <i class="fa fa-user"></i>
        <input id="rname" class="input" placeholder="Full name" required minlength="2">
      </div>
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input id="remail" class="input" placeholder="Email" type="email" required>
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input id="rpassword" type="password" class="input" placeholder="Password (min 6 characters)" required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <p class="msg" id="msg"></p>
  </div>
</div>

<div class="footer">
  <i class="fa fa-code"></i> Developed by <strong>Maviya Attar</strong>
</div>

<script src="js/script.js"></script>
</body>
</html>
